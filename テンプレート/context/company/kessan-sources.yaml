# 会計システムを使わない会社の帳簿づくり（kessan）で使う、口座と明細CSVの形式。
# 使い方：../../../.claude/scripts/kessan/README.md
# 口座番号・ID・パスワードは書かない。

formats:
  # 例：ネットバンキングの入出金明細CSV（列見出しは実際のファイルに合わせて書き換える）
  example-bank:
    encoding: cp932          # Shift-JIS のCSVは cp932、UTF-8 は utf-8-sig
    header_row: 1            # 列見出しがある行（1始まり）
    date_format: "%Y/%m/%d"
    columns:                 # 左は固定、右を実際のCSVの列見出しにする
      日付: 取引日
      出金: お引出し
      入金: お預入れ
      摘要: お取引内容
      残高: 残高             # 残高列が無い形式はこの行を消す

# 領収書の既定の支払方法。読み取った支払方法が「不明」で、口座・カード・現金の明細にも該当が無いときに使う。
#   立替：役員が個人で立て替えた（貸方 役員借入金）／現金：会社の現金で払った（貸方 現金）
#   決まっていなければ空欄のまま（貸方を空けて要確認にする）。accounting-rules.md の「領収書の既定の支払方法」と同じにする。
receipt_default: ""

# 口座・カード・現金の登録。明細（CSV・通帳・出納帳）の取り込み先で、領収書と突き合わせる相手にもなる。
# 現金（出納帳・現金払いの領収書）も突き合わせの相手にするときは、id: cash・科目: 現金 を format なしで登録する。
accounts: []
# 口座を登録するときは、上の「accounts: []」の行を消し、次の行から下のコメント記号「# 」を外して書き換える。
# accounts:
#   - id: main               # import-bank の --account-id に指定する名前
#     format: example-bank   # 上の formats に書いた明細形式の名前
#     科目: 普通預金
#     補助: ○○銀行 ○○支店
