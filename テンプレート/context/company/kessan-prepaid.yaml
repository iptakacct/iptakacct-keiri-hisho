# 前払費用の登録簿（会計システムを使わない会社の決算整理 kessan-close で、年払いの費用を前払に振り替える根拠）。
# 使い方：../../../.claude/scripts/kessan/README.md の「決算整理」
# ここに登録した費用の支払（journal.csv の行）について、期末日より後の月数分を前払費用へ振り替える候補を作る。
# 期首に前払費用の残高がある場合は、同じ名前の科目へ戻す候補を作る（名前が登録簿に無いと所見になる）。
# 摘要キーワード・取引先は、半角/全角・空白・法人格略語をそろえてから部分一致で照合する（どちらかは必須、最小2文字）。
# 摘要キーワードと取引先を両方書いたときは、両方に一致した行だけが対象（kessan-patterns.yaml と同じ）。
# 月数は役務の期間（支払月から数える。省くと12、最大12。1年を超える前払は長期前払費用として手で扱う）。科目は費用の科目。
# 登録・変更は、必ずオーナーの承認を得てから行う。

prepaid: []
# 登録するときは、上の「prepaid: []」の行を消し、次の行から下のコメント記号「# 」を外して書き換える。
# prepaid:
#   - 名前: 損害保険              # 前払費用の補助科目になる（期首残高の補助科目と同じ名前にする）
#     科目: 保険料
#     摘要キーワード: ソンポ       # 取引先 でもよい
#     月数: 12
