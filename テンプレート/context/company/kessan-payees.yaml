# 支払先の対応表（会計システムを使わない会社の帳簿づくり kessan で、領収書・請求書の取引先名と、通帳・カードの摘要に出る名義を結ぶ）
# 漢字の取引先名（例：テスト商事）が、摘要ではカナ（例：テストシヨウジ）で出るときに、証憑の突き合わせと確立済みパターンの照合で同じ相手とみなす。
# 追加は add-payee で行う（オーナーの承認を得てから。AIの判断だけで足さない）：
#   python .claude/scripts/kessan/cli.py add-payee --year-dir <年度フォルダ> --name テスト商事 --kana テストシヨウジ
# 書き方の例（足すまでは下の「payees: []」のままにする）：
# payees:
#   - {取引先: テスト商事, 名義: [テストシヨウジ, テストシヨウジ（カ]}
payees: []
