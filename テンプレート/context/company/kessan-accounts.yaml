# 会社別の追加科目（会計システムを使わない会社の帳簿づくり kessan で、共通の科目マスタに無い科目を足す）。
# 共通の科目マスタ：../../../.claude/scripts/kessan/accounts-master.csv（同じ名前の科目は足せない。先にマスタを見る）
# 追加した科目は、マスタの科目の後ろに並ぶ。仕訳・試算表・決算整理で、マスタの科目と同じように使える。
# 追加はオーナーの承認を得てから行う（AIの判断だけで追加しない）。固有名詞のない一般的な科目は共通のマスタへ足す。
#
# 書き方：下の「accounts:」の行から下のコメント記号「# 」を外して書き換える（足す科目が無いうちは全部コメントのままにする）。
# accounts:
#   - {科目: 業務委託料, 区分: 費用, 正常残高: 借, 表示区分: 販売費及び一般管理費, 既定税区分: 課税仕入10%}
#
# 区分：資産・負債・純資産・収益・費用のどれか
# 正常残高：借 か 貸（残高が積み上がる側）
# 表示区分：決算書での区分。区分に合うものだけ使える（資産：流動資産・有形固定資産・無形固定資産・投資その他の資産・繰延資産／負債：流動負債・固定負債／純資産：株主資本・評価・換算差額等／収益：売上高・営業外収益・特別利益／費用：売上原価・販売費及び一般管理費・営業外費用・特別損失・法人税等）
# 概況書項目：任意。法人事業概況説明書のどの欄に入る科目か。使える値：現金預金・受取手形・売掛金・棚卸資産・貸付金・建物・機械装置・車両船舶・土地・支払手形・買掛金・個人借入金・その他借入金・仕入・労務費・外注費・役員報酬・従業員給料・人件費・交際費・減価償却費・地代家賃・租税公課・支払利息
#   例：{科目: 業務委託料, 区分: 費用, 正常残高: 借, 表示区分: 販売費及び一般管理費, 概況書項目: 外注費}
# 既定税区分：任意。課税の年度に、税区分が決まらない行へ補う値（空なら補わない）。使える値は kessan の税区分のとおり
